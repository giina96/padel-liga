<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 Padel Liga</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f4fb;--white:#fff;--blue:#1a4fde;--blue-dark:#1240b8;
  --blue-light:#e8eeff;--text:#0d1117;--muted:#6b7a99;--border:#dde3f0;
  --danger:#dc2626;--success:#16a34a;
  --gold:#b8860b;--silver:#7a8a9e;--bronze:#a0522d;
  --shadow:0 2px 10px rgba(26,79,222,.08);--shadow-lg:0 8px 32px rgba(26,79,222,.14);
  --pink:#d946a8;--pink-dark:#b03990;--pink-light:#fce7f6;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}

/* ── SCREENS ─────────────────────────── */
.screen{display:none;}
#screen-login.active{display:flex;min-height:100vh;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1a4fde 0%,#0d2b8a 100%);}
#screen-liga.active{display:flex;min-height:100vh;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1a4fde 0%,#0d2b8a 100%);}
#screen-app.active{display:block;}
.login-card{background:var(--white);border-radius:20px;padding:44px 34px;width:330px;
  box-shadow:0 20px 60px rgba(0,0,0,.28);}
.login-logo{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;
  color:var(--blue);letter-spacing:1px;text-align:center;}
.login-logo em{color:var(--text);font-style:normal;}
.login-sub{text-align:center;color:var(--muted);font-size:11px;letter-spacing:1.5px;
  text-transform:uppercase;margin:4px 0 26px;}
.field{margin-bottom:11px;}
.field label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:1px;color:var(--muted);margin-bottom:4px;}
.field input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;
  padding:10px 12px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;
  outline:none;transition:border-color .2s;}
.field input:focus{border-color:var(--blue);background:var(--white);}
.btn-primary{display:block;width:100%;padding:12px;background:var(--blue);color:#fff;
  font-family:'Inter',sans-serif;font-weight:700;font-size:14px;border:none;
  border-radius:10px;cursor:pointer;transition:background .2s;text-align:center;}
.btn-primary:hover{background:var(--blue-dark);}
#login-error{color:var(--danger);font-size:12px;margin-top:8px;text-align:center;}

/* ── LIGA AUSWAHL ───────────────────────── */
.liga-card{background:var(--white);border-radius:20px;padding:40px 32px;width:330px;
  box-shadow:0 20px 60px rgba(0,0,0,.28);text-align:center;}
.liga-card-title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;
  color:var(--text);margin-bottom:4px;}
.liga-card-sub{font-size:12px;color:var(--muted);margin-bottom:28px;}
.liga-btn{display:block;width:100%;padding:16px;border:none;border-radius:12px;
  font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;
  letter-spacing:1px;cursor:pointer;margin-bottom:12px;transition:transform .1s,opacity .2s;}
.liga-btn:hover{opacity:.9;transform:scale(.99);}
.liga-btn:active{transform:scale(.97);}
.liga-btn-m{background:var(--blue);color:#fff;}
.liga-btn-f{background:var(--pink);color:#fff;}
.liga-btn-back{background:var(--bg);color:var(--muted);font-size:13px;
  font-family:'Inter',sans-serif;font-weight:600;padding:10px;margin-top:4px;}

/* ── APP ────────────────────────────────── */
#screen-app{display:none;}
#screen-app.active{display:block;}

/* ── TOPBAR ────────────────────────────── */
.topbar{color:#fff;padding:0 14px;height:50px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;}
.topbar.male{background:var(--blue);box-shadow:0 2px 12px rgba(26,79,222,.3);}
.topbar.female{background:var(--pink);box-shadow:0 2px 12px rgba(217,70,168,.3);}
.topbar-left{display:flex;align-items:center;gap:10px;}
.topbar-logo{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:800;letter-spacing:1px;}
.topbar-liga-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;
  background:rgba(255,255,255,.2);color:#fff;letter-spacing:.5px;}
.topbar-right{display:flex;align-items:center;gap:7px;}
.badge-team{background:rgba(255,255,255,.2);color:#fff;padding:3px 9px;
  border-radius:20px;font-size:11px;font-weight:600;}
.btn-topbar{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
  color:#fff;padding:4px 10px;font-size:11px;border-radius:6px;cursor:pointer;
  font-family:'Inter',sans-serif;font-weight:600;}

/* ── NAV ───────────────────────────────── */
.nav{background:var(--white);border-bottom:2px solid var(--border);
  display:flex;overflow-x:auto;padding:0 6px;}
.nav-btn{background:none;border:none;color:var(--muted);font-family:'Inter',sans-serif;
  font-size:13px;font-weight:600;padding:13px 13px;cursor:pointer;
  border-bottom:2.5px solid transparent;white-space:nowrap;transition:all .2s;margin-bottom:-2px;}
.nav-btn.active-m{color:var(--blue);border-bottom-color:var(--blue);}
.nav-btn.active-f{color:var(--pink);border-bottom-color:var(--pink);}

/* ── MAIN ──────────────────────────────── */
.main{padding:14px;max-width:660px;margin:0 auto;}
.page{display:none;}
.page.active{display:block;}
.card{background:var(--white);border:1px solid var(--border);border-radius:13px;
  padding:15px;margin-bottom:11px;box-shadow:var(--shadow);}
.sec-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;
  letter-spacing:1px;color:var(--text);margin-bottom:11px;}

/* ── WEEK ACCORDION ────────────────────── */
.week-accordion{background:var(--white);border:1.5px solid var(--border);border-radius:12px;
  margin-bottom:9px;overflow:hidden;box-shadow:var(--shadow);}
.week-accordion.my-week-m{border-color:var(--blue);}
.week-accordion.my-week-f{border-color:var(--pink);}
.week-acc-header{display:flex;align-items:center;gap:9px;padding:12px 14px;
  cursor:pointer;user-select:none;transition:background .15s;}
.week-acc-header:hover{background:var(--bg);}
.week-pill{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:1.5px;padding:3px 9px;border-radius:20px;background:var(--border);
  color:var(--muted);white-space:nowrap;text-transform:uppercase;flex-shrink:0;}
.week-pill.current-m{background:var(--blue);color:#fff;}
.week-pill.current-f{background:var(--pink);color:#fff;}
.week-pill.done{background:#dcfce7;color:var(--success);}
.week-acc-title{font-weight:700;font-size:14px;color:var(--text);flex:1;min-width:0;}
.week-acc-meta{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.week-my-dot-m{color:var(--blue);font-size:13px;}
.week-my-dot-f{color:var(--pink);font-size:13px;}
.week-progress-mini{font-size:11px;color:var(--muted);}
.week-period-mini{font-size:11px;color:var(--muted);white-space:nowrap;}
.week-chevron{font-size:13px;color:var(--muted);transition:transform .25s;flex-shrink:0;}
.week-chevron.open{transform:rotate(180deg);}
.week-acc-body{display:none;padding:0 12px 12px;}
.week-acc-body.open{display:block;}
.week-progress-bar-wrap{height:3px;background:var(--border);border-radius:2px;
  margin:0 14px 10px;overflow:hidden;}
.week-progress-bar-m{height:100%;background:var(--blue);border-radius:2px;transition:width .4s;}
.week-progress-bar-f{height:100%;background:var(--pink);border-radius:2px;transition:width .4s;}

/* ── MATCH CARD ────────────────────────── */
.match-card{background:#f8faff;border:1.5px solid var(--border);border-radius:10px;
  padding:10px 11px;margin-bottom:7px;}
.match-card.highlight-m{border-color:var(--blue);background:var(--blue-light);}
.match-card.highlight-f{border-color:var(--pink);background:var(--pink-light);}
.match-phase-row{margin-bottom:6px;}
.match-body{display:flex;align-items:stretch;gap:8px;}
.match-teams-col{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0;}
.match-team-row{display:flex;align-items:center;background:var(--white);
  border:1px solid var(--border);border-radius:7px;padding:7px 9px;min-width:0;}
.match-team-row.winner-m{border-color:var(--blue);background:var(--blue-light);}
.match-team-row.winner-f{border-color:var(--pink);background:var(--pink-light);}
.team-name-main{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.team-players-txt{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.match-score-col{display:flex;flex-direction:column;align-items:center;
  justify-content:space-around;min-width:30px;padding:4px 0;}
.score-box{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;
  line-height:1;text-align:center;width:28px;}
.score-box.male{color:var(--blue);}
.score-box.female{color:var(--pink);}
.score-box.tbd{font-size:13px;color:var(--border);}
.vs-lbl{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:1px;}
.match-btn-row{display:flex;justify-content:flex-end;margin-top:7px;}
.pts-result{border-radius:7px;padding:7px 10px;margin-top:7px;font-size:12px;
  font-weight:600;display:flex;flex-direction:column;gap:2px;}
.pts-result.male{background:var(--blue-light);color:var(--blue);}
.pts-result.female{background:var(--pink-light);color:var(--pink);}
.pts-result span{display:flex;justify-content:space-between;}

/* ── PHASE BADGES ──────────────────────── */
.phase-badge{display:inline-block;padding:2px 7px;border-radius:4px;
  font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;}
.pb-group{background:var(--blue-light);color:var(--blue);}
.pb-group-f{background:var(--pink-light);color:var(--pink);}
.pb-af{background:#fef3c7;color:#92400e;}
.pb-vf{background:#fce7f3;color:#9d174d;}
.pb-hf{background:#ede9fe;color:#5b21b6;}
.pb-3rd{background:#fdf3e7;color:var(--bronze);}
.pb-final{background:#fef9c3;color:#78350f;}

/* ── BUTTONS ───────────────────────────── */
.btn-sm{padding:6px 12px;font-size:12px;font-weight:700;border-radius:6px;
  border:none;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.btn-m{background:var(--blue);color:#fff;}
.btn-m:hover{background:var(--blue-dark);}
.btn-f{background:var(--pink);color:#fff;}
.btn-f:hover{background:var(--pink-dark);}

/* ── TABELLE ───────────────────────────── */
.group-tabs{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;}
.group-tab{padding:6px 15px;border-radius:8px;border:1.5px solid var(--border);
  background:var(--white);color:var(--muted);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .15s;}
.group-tab.active-m{background:var(--blue);color:#fff;border-color:var(--blue);}
.group-tab.active-f{background:var(--pink);color:#fff;border-color:var(--pink);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;padding:7px 8px;font-size:10px;text-transform:uppercase;
  letter-spacing:1.2px;color:var(--muted);border-bottom:2px solid var(--border);font-weight:600;}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--blue-light);}
td{padding:9px 8px;vertical-align:middle;}
.rank{font-weight:800;color:var(--muted);width:22px;font-size:14px;}
.rank-1{color:var(--gold);}
.rank-2{color:var(--silver);}
.rank-3{color:var(--bronze);}
.rank-qual-m{color:var(--blue);}
.rank-qual-f{color:var(--pink);}
.tbl-name{font-weight:700;font-size:13px;}
.tbl-players{font-size:11px;color:var(--muted);}
.adv-m{font-size:10px;font-weight:700;color:var(--blue);margin-left:4px;
  background:var(--blue-light);padding:1px 5px;border-radius:3px;}
.adv-f{font-size:10px;font-weight:700;color:var(--pink);margin-left:4px;
  background:var(--pink-light);padding:1px 5px;border-radius:3px;}
.pts{font-weight:800;font-size:15px;}
.pts-m{color:var(--blue);}
.pts-f{color:var(--pink);}
.num{color:var(--muted);font-size:12px;}

/* ── KO ────────────────────────────────── */
.ko-round{margin-bottom:18px;}
.ko-round-hdr{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;
  letter-spacing:1.5px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;}
.ko-round-hdr::after{content:'';flex:1;height:1px;background:var(--border);}
.ko-period{font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none;}
.ko-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ko-match{background:var(--white);border:1.5px solid var(--border);border-radius:10px;
  overflow:hidden;box-shadow:var(--shadow);}
.ko-match.my-ko-m{border-color:var(--blue);}
.ko-match.my-ko-f{border-color:var(--pink);}
.ko-num{font-size:10px;color:var(--muted);padding:3px 10px;
  background:var(--bg);border-bottom:1px solid var(--border);font-weight:600;}
.ko-team{padding:7px 10px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);gap:6px;}
.ko-team:last-of-type{border-bottom:none;}
.ko-team.winner-m{background:var(--blue-light);}
.ko-team.winner-f{background:var(--pink-light);}
.ko-team-name{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:1;}
.ko-team-pl{font-size:10px;color:var(--muted);}
.ko-sc{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;
  min-width:18px;text-align:right;}
.ko-sc.male{color:var(--blue);}
.ko-sc.female{color:var(--pink);}
.ko-sc.tbd{color:var(--border);font-size:12px;}
.ko-action{padding:5px 8px;border-top:1px solid var(--border);background:#f8faff;}

/* ── MODAL ─────────────────────────────── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
  align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--white);border-radius:16px;padding:22px 18px;width:100%;
  max-width:310px;box-shadow:var(--shadow-lg);}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;margin-bottom:2px;}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.4;}
.score-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.score-row input{width:62px;text-align:center;font-size:26px;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;background:var(--bg);
  border:2px solid var(--border);border-radius:8px;padding:10px 6px;outline:none;transition:border-color .2s;}
.score-row input:focus{border-color:var(--blue);}
.score-row input.female:focus{border-color:var(--pink);}
.score-row span{font-size:16px;color:var(--muted);font-weight:700;}
.modal-actions{display:flex;gap:7px;}
.btn-cancel{flex:1;padding:10px;background:var(--bg);color:var(--muted);
  font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
  border:1.5px solid var(--border);border-radius:10px;cursor:pointer;}
.btn-save{flex:1;padding:10px;color:#fff;font-family:'Inter',sans-serif;
  font-weight:700;font-size:13px;border:none;border-radius:10px;cursor:pointer;}
.btn-save.male{background:var(--blue);}
.btn-save.female{background:var(--pink);}

/* ── SETTINGS ──────────────────────────── */
.settings-sec{margin-bottom:16px;}
.settings-lbl{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
  letter-spacing:1px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;}
.liga-switcher{display:flex;gap:8px;margin-bottom:14px;}
.liga-switch-btn{flex:1;padding:10px;border-radius:10px;border:2px solid var(--border);
  background:var(--white);font-family:'Barlow Condensed',sans-serif;font-size:16px;
  font-weight:800;cursor:pointer;transition:all .15s;color:var(--muted);}
.liga-switch-btn.active-m{background:var(--blue);color:#fff;border-color:var(--blue);}
.liga-switch-btn.active-f{background:var(--pink);color:#fff;border-color:var(--pink);}
.config-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.config-label{font-size:13px;font-weight:600;min-width:160px;}
.config-row input[type="number"]{width:70px;padding:7px 8px;border:1.5px solid var(--border);
  border-radius:7px;font-size:14px;font-family:'Inter',sans-serif;background:var(--bg);
  color:var(--text);outline:none;text-align:center;}
.config-row input:focus{border-color:var(--blue);}
.week-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
.week-row-lbl{font-size:12px;font-weight:600;min-width:80px;flex-shrink:0;}
.week-row input[type="date"]{flex:1;min-width:110px;padding:7px 8px;
  border:1.5px solid var(--border);border-radius:7px;font-size:12px;
  font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);outline:none;}
.week-row input:focus{border-color:var(--blue);}
.team-card{background:#f8faff;border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;margin-bottom:7px;}
.team-card-hdr{font-weight:700;font-size:12px;margin-bottom:7px;}
.team-card-hdr.male{color:var(--blue);}
.team-card-hdr.female{color:var(--pink);}
.team-inputs{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.team-inputs input{padding:7px 9px;border:1.5px solid var(--border);border-radius:7px;
  font-size:12px;font-family:'Inter',sans-serif;background:var(--white);
  color:var(--text);outline:none;width:100%;}
.team-inputs input:focus{border-color:var(--blue);}
.save-btn{padding:9px 18px;color:#fff;border:none;border-radius:8px;
  font-family:'Inter',sans-serif;font-weight:700;font-size:13px;cursor:pointer;margin-top:8px;}
.save-btn.male{background:var(--blue);}
.save-btn.female{background:var(--pink);}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0;}
.admin-grp-tabs-wrap{margin-bottom:8px;}

/* ── TOAST ─────────────────────────────── */
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(80px);
  color:#fff;padding:10px 20px;border-radius:10px;font-weight:700;font-size:13px;
  z-index:999;opacity:0;transition:all .3s;white-space:nowrap;box-shadow:var(--shadow-lg);}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.toast.male{background:var(--blue);}
.toast.female{background:var(--pink);}
.toast.error{background:var(--danger);}
.toast.ok{background:var(--success);}
.empty{text-align:center;color:var(--muted);padding:14px;font-size:12px;
  background:#f8faff;border-radius:8px;}

@media(max-width:440px){
  .ko-grid{grid-template-columns:1fr;}
  .team-inputs{grid-template-columns:1fr;}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ══ LOGIN ══════════════════════════════ -->
<div id="screen-login" class="screen active">
  <div class="login-card">
    <div class="login-logo">4 <em>PADEL</em> LIGA</div>
    <div class="login-sub">Saison 2025</div>
    <div class="field"><label>E-Mail</label>
      <input type="email" id="login-email" placeholder="deine@email.de" autocomplete="email"></div>
    <div class="field"><label>Passwort</label>
      <input type="password" id="login-password" placeholder="••••••••"></div>
    <button class="btn-primary" onclick="doLogin()">Einloggen</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- ══ LIGA AUSWAHL ════════════════════════ -->
<div id="screen-liga" class="screen">
  <div class="liga-card">
    <div class="liga-card-title">Welche Liga?</div>
    <div class="liga-card-sub" id="liga-welcome"></div>
    <button class="liga-btn liga-btn-m" onclick="selectLiga('male')">MÄNNER LIGA</button>
    <button class="liga-btn liga-btn-f" onclick="selectLiga('female')">FRAUEN LIGA</button>
    <button class="liga-btn liga-btn-back" onclick="doLogout()">← Logout</button>
  </div>
</div>

<!-- ══ APP ════════════════════════════════ -->
<div id="screen-app" class="screen">
  <div class="topbar" id="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">4 PADEL LIGA</div>
      <span class="topbar-liga-badge" id="topbar-liga-badge"></span>
    </div>
    <div class="topbar-right">

const SUPABASE_KEY = 'sb_publishable_HiWaFK6MGC2As0xk_MHKjw__LHnAYLi';

const FIRST_M = ['Luca','Max','Jonas','Tim','Felix','Ben','Nico','Tom','Jan','Erik','Finn','Paul','Leon','Noah','Elias','Luis','Moritz','David','Simon','Alex'];
const FIRST_F = ['Anna','Laura','Sarah','Julia','Lisa','Marie','Jana','Nina','Sophie','Emma','Clara','Lea','Mia','Hannah','Lena','Maja','Paula','Nora','Lara','Pia'];
const LAST_N  = ['Müller','Schmidt','Weber','Fischer','Meyer','Wagner','Koch','Becker','Hoffmann','Richter','Klein','Wolf','Schröder','Neumann','Braun'];

function genLeague(league) {
  const {numGroups, teamsPerGroup} = league.config;
  const isFem = league.gender === 'female';
  const fn = isFem ? FIRST_F : FIRST_M;
  const teams = [], matches = [];
  let tid = 1, mid = 1, ni = 0;
  const rn = () => `${fn[ni % fn.length]} ${LAST_N[Math.floor(ni++ / 2) % LAST_N.length]}`;
  const groupLabels = 'ABCDEFGH'.slice(0, numGroups).split('');

  groupLabels.forEach(g => {
    for (let t = 1; t <= teamsPerGroup; t++) {
      teams.push({ id: tid++, gruppe: g, nummer: t,
        spieler1: rn(), spieler2: rn(), name: `Gruppe ${g} Team ${t}` });
    }
  });

  // Round Robin per group
  groupLabels.forEach(g => {
    const gt = teams.filter(t => t.gruppe === g);
    for (let i = 0; i < gt.length; i++)
      for (let j = i + 1; j < gt.length; j++)
        matches.push({ id: mid++, phase: 'group', gruppe: g,
          team_a_id: gt[i].id, team_b_id: gt[j].id, score_a: null, score_b: null });
  });

  // KO rounds based on numGroups
  const koSlots = buildKOSlots(numGroups, groupLabels);
  koSlots.forEach(s => matches.push({ ...s, id: mid++, score_a: null, score_b: null }));

  // Weeks
  const weeks = buildWeeks(numGroups);

  league.teams = teams;
  league.matches = matches;
  league.weeks = weeks;

  // Demo team assignment: player@liga.de -> Gruppe A Team 2 of this league
  const demoTeam = teams.find(t => t.gruppe === 'A' && t.nummer === 2);
  league.teamAssignments['spieler@liga.de'] = demoTeam?.id || null;
}

function buildKOSlots(numGroups, groupLabels) {
  const slots = [];
  // With 2 groups: VF(4) -> HF(2) -> Final
  // With 3 groups: AF(4 from top2 + 2 best 3rd playoff) -> VF -> HF -> Final (simplified: top2 each + 2 from 3rd RR)
  // With 4 groups: AF(8) -> VF(4) -> HF(2) -> Final

  if (numGroups === 2) {
    // Top 4 each group -> VF (4 matches)
    // VF1: A1vsB4, VF2:B1vsA4, VF3:A2vsB3, VF4:B2vsA3
    const vfPairs = [
      {la:`Gruppe A Platz 1`,lb:`Gruppe B Platz 4`},
      {la:`Gruppe B Platz 1`,lb:`Gruppe A Platz 4`},
      {la:`Gruppe A Platz 2`,lb:`Gruppe B Platz 3`},
      {la:`Gruppe B Platz 2`,lb:`Gruppe A Platz 3`},
    ];
    vfPairs.forEach((p,i) => slots.push({phase:'vf',slot:i+1,gruppe:null,team_a_id:null,team_b_id:null,label_a:p.la,label_b:p.lb}));
    slots.push({phase:'hf',slot:1,gruppe:null,team_a_id:null,team_b_id:null,label_a:'Sieger VF1',label_b:'Sieger VF3'});
    slots.push({phase:'hf',slot:2,gruppe:null,team_a_id:null,team_b_id:null,label_a:'Sieger VF2',label_b:'Sieger VF4'});
  } else if (numGroups === 3) {
    // Top 2 each group (6) + 2 best 3rd (from 3-team RR) = 8 for VF
    // 3rd place RR matches
    slots.push({phase:'3rd_rr',slot:1,gruppe:null,team_a_id:null,team_b_id:null,label_a:'Dritter Gruppe A',label_b:'Dritter Gruppe B'});
    slots.push({phase:'3rd_rr',slot:2,gruppe:null,team_a_id:null,team_b_id:null,label_a:'Dritter Gruppe A',label_b:'Dritter Gruppe C'});
    slots.push({phase:'3rd_rr',slot:3,gruppe:null,team_a_id:null,team_b_id:null,label_a:'Dritter Gruppe B',label_b:'Dritter Gruppe C'});
    // VF
    const vfPairs = [
      {la:'Gruppe A Platz 1',lb:'Bester 3. (Platz 2)'},{la:'Gruppe B Platz 1',lb:'Bester 3. (Platz 1)'},
      {la:'Gruppe A Platz 2',lb:'Gruppe C Platz 2'},{la:'Gruppe B Platz 2',lb:'Gruppe C Platz 1'},
    ];
    vfPairs.forEach((p,i) => slots.push({phase:'vf',slot:i+1,gruppe:null,team_a_id:null,team_b_id:null,label_a:p.la,label_b:p.lb}));
    slots.push({phase:'hf',slot:1,gruppe:null,team_a_id:null,team_b_id:null,label_a:'Sieger VF1',label_b:'Sieger VF3'});
    slots.push({phase:'hf',slot:2,gruppe:null,team_a_id:null,team_b_id:null,label_a:'Sieger VF2',label_b:'Sieger VF4'});
  } else {
    // 4 groups: AF(8) -> VF(4) -> HF(2) -> Final
    const afPairs = [
      {la:'Gruppe A Platz 1',lb:'Gruppe B Platz 4'},{la:'Gruppe B Platz 1',lb:'Gruppe A Platz 4'},
      {la:'Gruppe A Platz 2',lb:'Gruppe B Platz 3'},{la:'Gruppe B Platz 2',lb:'Gruppe A Platz 3'},
      {la:'Gruppe C Platz 1',lb:'Gruppe D Platz 4'},{la:'Gruppe D Platz 1',lb:'Gruppe C Platz 4'},
      {la:'Gruppe C Platz 2',lb:'Gruppe D Platz 3'},{la:'Gruppe D Platz 2',lb:'Gruppe C Platz 3'},
    ];
    afPairs.forEach((p,i) => slots.push({phase:'af',slot:i+1,gruppe:null,team_a_id:null,team_b_id:null,label_a:p.la,label_b:p.lb}));
    [[1,1,5],[2,2,6],[3,3,7],[4,4,8]].forEach(([vs,a,b]) =>
      slots.push({phase:'vf',slot:vs,gruppe:null,team_a_id:null,team_b_id:null,label_a:`Sieger AF${a}`,label_b:`Sieger AF${b}`}));
    slots.push({phase:'hf',slot:1,gruppe:null,team_a_id:null,team_b_id:null,label_a:'Sieger VF1',label_b:'Sieger VF3'});
    slots.push({phase:'hf',slot:2,gruppe:null,team_a_id:null,team_b_id:null,label_a:'Sieger VF2',label_b:'Sieger VF4'});
  }
  slots.push({phase:'final',slot:1,gruppe:null,team_a_id:null,team_b_id:null,label_a:'Sieger HF1',label_b:'Sieger HF2'});
  slots.push({phase:'platz3',slot:1,gruppe:null,team_a_id:null,team_b_id:null,label_a:'Verlierer HF1',label_b:'Verlierer HF2'});
  return slots;
}

function buildWeeks(numGroups) {
  const w = {};
  const groupLabels = 'ABCDEFGH'.slice(0,numGroups).split('');
  groupLabels.forEach((g,i) => {
    w[i+1] = {label:`Woche ${i+1}`, sub:`Vorrunde Gruppe ${g}`, von:'', bis:''};
  });
  const base = numGroups;
  if (numGroups === 3) {
    w[base+1] = {label:`Woche ${base+1}`, sub:'Playoff der Dritten', von:'', bis:''};
    w[base+2] = {label:`Woche ${base+2}–${base+3}`, sub:'Viertelfinale', von:'', bis:''};
    w[base+4] = {label:`Woche ${base+4}`, sub:'Halbfinale', von:'', bis:''};
    w[base+5] = {label:`Woche ${base+5}`, sub:'Finale & Platz 3', von:'', bis:''};
  } else if (numGroups === 4) {
    w[5] = {label:'Woche 5–6', sub:'Achtelfinale', von:'', bis:''};
    w[7] = {label:'Woche 7', sub:'Viertelfinale', von:'', bis:''};
    w[8] = {label:'Woche 8', sub:'Halbfinale', von:'', bis:''};
    w[9] = {label:'Woche 9', sub:'Finale & Platz 3', von:'', bis:''};
  } else {
    w[base+1] = {label:`Woche ${base+1}–${base+2}`, sub:'Viertelfinale', von:'', bis:''};
    w[base+3] = {label:`Woche ${base+3}`, sub:'Halbfinale', von:'', bis:''};
    w[base+4] = {label:`Woche ${base+4}`, sub:'Finale & Platz 3', von:'', bis:''};
  }
  return w;
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!email || !pw) { errEl.textContent = 'Bitte E-Mail und Passwort eingeben.'; return; }

  const btnEl = document.querySelector('#screen-login .btn-primary');
  btnEl.textContent = 'Einloggen...'; btnEl.disabled = true;

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    await loadSessionData(data.user);
    showScreen('liga');
    document.getElementById('liga-welcome').textContent = `Eingeloggt als: ${email}`;
  } catch(e) {
    errEl.textContent = e.message === 'Invalid login credentials'
      ? 'E-Mail oder Passwort falsch.' : e.message;
  } finally {
    btnEl.textContent = 'Einloggen'; btnEl.disabled = false;
  }
}

async function loadSessionData(user) {
  SESSION.email = user.email;

  // Load profile
  const { data: profile } = await sb.from('profiles').select('*').eq('user_id', user.id).single();
  SESSION.isAdmin = profile?.is_admin === true || profile?.is_admin === 'true';
  SESSION.profile = profile;
  console.log('Profile loaded:', profile, 'isAdmin:', SESSION.isAdmin);

  // Load both league configs
  const { data: configs } = await sb.from('liga_config').select('*');
  configs?.forEach(c => {
    const league = LEAGUES[c.liga];
    if (!league) return;
    league.config.numGroups = c.num_groups;
    league.config.teamsPerGroup = c.teams_per_group;
    league.weeks = c.weeks || buildWeeks(c.num_groups);
  });

  // Load teams for both leagues
  const { data: teams } = await sb.from('teams').select('*').order('gruppe').order('nummer');
  LEAGUES.male.teams   = teams?.filter(t => t.liga === 'male')   || [];
  LEAGUES.female.teams = teams?.filter(t => t.liga === 'female') || [];

  // Load matches for both leagues
  const { data: matches } = await sb.from('matches').select('*').order('id');
  LEAGUES.male.matches   = matches?.filter(m => m.liga === 'male')   || [];
  LEAGUES.female.matches = matches?.filter(m => m.liga === 'female') || [];

  // Set team assignments
  if (!SESSION.isAdmin && profile?.team_id) {
    const teamRow = teams?.find(t => t.id === profile.team_id);
    if (teamRow) {
      SESSION.currentTeamId = teamRow.id;
      LEAGUES[teamRow.liga].teamAssignments[user.email] = teamRow.id;
    }
  }

  openWeeks = { male: new Set(), female: new Set() };
  tblGroup = { male: 'A', female: 'A' };
  adminGrp = { male: 'A', female: 'A' };
  adminMatchGrp = { male: 'A', female: 'A' };
}

function buildWCFG(league) {
  const {numGroups} = league.config;
  const groupLabels = 'ABCDEFGH'.slice(0, numGroups).split('');
  const cfg = [];
  groupLabels.forEach((g, i) => cfg.push({ wk: i+1, phases: ['group'], grp: [g] }));
  const base = numGroups;
  if (numGroups === 4) {
    cfg.push({ wk:5, phases:['af'], grp:[] });
    cfg.push({ wk:7, phases:['vf'], grp:[] });
    cfg.push({ wk:8, phases:['hf'], grp:[] });
    cfg.push({ wk:9, phases:['final','platz3'], grp:[] });
  } else if (numGroups === 3) {
    cfg.push({ wk:base+1, phases:['3rd_rr'], grp:[] });
    cfg.push({ wk:base+2, phases:['vf'], grp:[] });
    cfg.push({ wk:base+4, phases:['hf'], grp:[] });
    cfg.push({ wk:base+5, phases:['final','platz3'], grp:[] });
  } else {
    cfg.push({ wk:base+1, phases:['vf'], grp:[] });
    cfg.push({ wk:base+3, phases:['hf'], grp:[] });
    cfg.push({ wk:base+4, phases:['final','platz3'], grp:[] });
  }
  return cfg;
}

function renderSpielplan() {
  const league = L();
  const myId = SESSION.currentTeamId;
  const isFem = isFemale();
  const ac = accentClass();
  const ow = openWeeks[SESSION.currentLeague];
  const wcfg = buildWCFG(league);

  const html = wcfg.map(wc => {
    const ws = league.weeks[wc.wk];
    let ms = [];
    wc.phases.forEach(ph => {
      if (ph === 'group') wc.grp.forEach(g =>
        ms = ms.concat(league.matches.filter(m => m.phase === 'group' && m.gruppe === g)));
      else ms = ms.concat(league.matches.filter(m => m.phase === ph));
    });
    const total = ms.length, played = ms.filter(m => m.score_a !== null).length;
    const pct = total > 0 ? Math.round(played / total * 100) : 0;
    const done = played === total && total > 0;
    const cur = !done && played > 0;
    const hasMe = ms.some(m => myId && (m.team_a_id === myId || m.team_b_id === myId));
    const period = ws?.von && ws?.bis ? `${df(ws.von)}–${df(ws.bis)}` : ws?.von ? `ab ${df(ws.von)}` : '';
    const pillCls = done ? 'done' : cur ? `current-${ac}` : '';
    const isOpen = ow.has(wc.wk) || ((hasMe || cur) && !ow.has(-wc.wk));
    if (isOpen && !ow.has(-wc.wk)) ow.add(wc.wk);
    const rows = ms.map(m => matchCard(m, myId, league, isFem)).join('');
    return `<div class="week-accordion ${hasMe ? `my-week-${ac}` : ''}">
      <div class="week-acc-header" onclick="toggleWeek(${wc.wk},this)">
        <span class="week-pill ${pillCls}">${ws?.label || 'Woche ' + wc.wk}</span>
        <span class="week-acc-title">${ws?.sub || ''} ${hasMe ? `<span class="week-my-dot-${ac}">●</span>` : ''}</span>
        <div class="week-acc-meta">
          <span class="week-progress-mini">${played}/${total}</span>

  const has = m.score_a !== null;
  const wA = has && m.score_a > m.score_b, wB = has && m.score_b > m.score_a;

          <div style="flex:1;min-width:0;">
            <div class="team-name-main">${nameA}</div>
            ${plA ? `<div class="team-players-txt">${plA}</div>` : ''}
          </div>
        </div>
        <div class="match-team-row ${has && wB ? `winner-${ac}` : ''}">
          <div style="flex:1;min-width:0;">
            <div class="team-name-main">${nameB}</div>
            ${plB ? `<div class="team-players-txt">${plB}</div>` : ''}
          </div>
        </div>
      </div>
      <div class="match-score-col">
        <div class="score-box ${ac} ${!has ? 'tbd' : ''}">${has ? m.score_a : '–'}</div>
        <div class="vs-lbl">VS</div>
        <div class="score-box ${ac} ${!has ? 'tbd' : ''}">${has ? m.score_b : '–'}</div>
      </div>
    </div>
    ${has ? `<div class="pts-result ${ac}">
      <span><span>${nameA}</span><strong>${ptsA} Punkt${ptsA === 1 ? '' : 'e'}</strong></span>
      <span><span>${nameB}</span><strong>${ptsB} Punkt${ptsB === 1 ? '' : 'e'}</strong></span>
    </div>` : ''}
    ${canEdit ? `<div class="match-btn-row">
      <button class="btn-sm btn-${ac}" onclick="openModal(${m.id},'${SESSION.currentLeague}')">${has ? '✏ Korrigieren' : '+ Ergebnis eintragen'}</button>
    </div>` : ''}

function koSlotLabel(m) {
  if (m.phase === 'af')    return `Achtelfinale AF${m.slot}`;
  if (m.phase === 'vf')    return `Viertelfinale VF${m.slot}`;
  if (m.phase === 'hf')    return `Halbfinale HF${m.slot}`;
  if (m.phase === '3rd_rr') return `Playoff der Dritten (Spiel ${m.slot})`;
  if (m.phase === 'final') return '🏆 Finale';
  if (m.phase === 'platz3') return 'Spiel um Platz 3';
  return '';
}

function pbadge(m, ac) {
  if (m.phase === 'group')   return `<span class="phase-badge pb-group${ac === 'female' ? '-f' : ''}">Gruppe ${m.gruppe}</span>`;
  if (m.phase === 'af')      return `<span class="phase-badge pb-af">Achtelfinale</span>`;
  if (m.phase === '3rd_rr')  return `<span class="phase-badge pb-af">Playoff Dritte</span>`;
  if (m.phase === 'vf')      return `<span class="phase-badge pb-vf">Viertelfinale</span>`;
  if (m.phase === 'hf')      return `<span class="phase-badge pb-hf">Halbfinale</span>`;
  if (m.phase === 'platz3')  return `<span class="phase-badge pb-3rd">Platz 3</span>`;
  if (m.phase === 'final')   return `<span class="phase-badge pb-final">🏆 Finale</span>`;
  return '';
}

// AUTO KO FILL
// ══════════════════════════════════════════
function tryFillKO(league) {
  const {numGroups} = league.config;
  const groupLabels = 'ABCDEFGH'.slice(0, numGroups).split('');

  const top = {};
  groupLabels.forEach(g => {
    const gMs = league.matches.filter(m => m.phase === 'group' && m.gruppe === g);
    if (!gMs.every(m => m.score_a !== null)) return;
    const stats = league.teams.filter(t => t.gruppe === g).map(t => {
      let pts = 0, w = 0;
      gMs.filter(m => m.team_a_id === t.id || m.team_b_id === t.id).forEach(m => {
        const isA = m.team_a_id === t.id;
        const ts = isA ? m.score_a : m.score_b, os = isA ? m.score_b : m.score_a;
        if (ts > os) { pts += 3; w++; } else if (ts === os) pts += 1;
      });
      return { ...t, pts, w };
    });
    stats.sort((a, b) => b.pts - a.pts || b.w - a.w);
    top[g] = stats;
  });

  if (numGroups === 4 && top['A'] && top['B'] && top['C'] && top['D']) {
    const afPairs = [
      [top.A[0], top.B[3]], [top.B[0], top.A[3]],
      [top.A[1], top.B[2]], [top.B[1], top.A[2]],
      [top.C[0], top.D[3]], [top.D[0], top.C[3]],
      [top.C[1], top.D[2]], [top.D[1], top.C[2]],
    ];
    afPairs.forEach(([tA, tB], i) => {
      const m = league.matches.find(m => m.phase === 'af' && m.slot === i + 1);
      if (m && tA && tB) { m.team_a_id = tA.id; m.team_b_id = tB.id; }
    });
  } else if (numGroups === 2 && top['A'] && top['B']) {
    const vfPairs = [
      [top.A[0], top.B[3]], [top.B[0], top.A[3]],
      [top.A[1], top.B[2]], [top.B[1], top.A[2]],
    ];
    vfPairs.forEach(([tA, tB], i) => {
      const m = league.matches.find(m => m.phase === 'vf' && m.slot === i + 1);
      if (m && tA && tB) { m.team_a_id = tA.id; m.team_b_id = tB.id; }
    });
  }

  // AF -> VF (4 groups)
  const afs = league.matches.filter(m => m.phase === 'af');
  if (afs.length && afs.every(m => m.score_a !== null && m.team_a_id)) {
    [[1,1,5],[2,2,6],[3,3,7],[4,4,8]].forEach(([vs, a, b]) => {
      const afA = afs.find(m => m.slot === a), afB = afs.find(m => m.slot === b);
      const vf = league.matches.find(m => m.phase === 'vf' && m.slot === vs);
      if (vf && afA && afB) { vf.team_a_id = winner(afA); vf.team_b_id = winner(afB); }
    });
  }

  // VF -> HF
  const vfs = league.matches.filter(m => m.phase === 'vf');
  if (vfs.length && vfs.every(m => m.score_a !== null && m.team_a_id)) {
    [[1,1,3],[2,2,4]].forEach(([hs, v1, v2]) => {
      const vA = vfs.find(m => m.slot === v1), vB = vfs.find(m => m.slot === v2);
      const hf = league.matches.find(m => m.phase === 'hf' && m.slot === hs);
      if (hf && vA && vB) { hf.team_a_id = winner(vA); hf.team_b_id = winner(vB); }
    });
  }

  // HF -> Final/Platz3
  const hfs = league.matches.filter(m => m.phase === 'hf');
  if (hfs.length && hfs.every(m => m.score_a !== null && m.team_a_id)) {
    const fin = league.matches.find(m => m.phase === 'final');
    const p3 = league.matches.find(m => m.phase === 'platz3');
    const h1 = hfs.find(m => m.slot === 1), h2 = hfs.find(m => m.slot === 2);
    if (fin && h1 && h2) { fin.team_a_id = winner(h1); fin.team_b_id = winner(h2); }
    if (p3 && h1 && h2) { p3.team_a_id = loser(h1); p3.team_b_id = loser(h2); }
  }
}

function winner(m) { return m.score_a > m.score_b ? m.team_a_id : m.team_b_id; }
function loser(m) { return m.score_a > m.score_b ? m.team_b_id : m.team_a_id; }

function renderKO() {
  const league = L();
  const myId = SESSION.currentTeamId;
  const isFem = isFemale();
  const ac = accentClass();
  const {numGroups} = league.config;
  let html = '';

  const addRound = (label, phases, wk) => {
    const ms = league.matches.filter(m => phases.includes(m.phase)).sort((a,b) => a.slot - b.slot);
    const ws = league.weeks[wk];
    const per = ws?.von && ws?.bis ? `📅 ${df(ws.von)}–${df(ws.bis)}` : ws?.von ? `📅 ab ${df(ws.von)}` : '';
    html += `<div class="ko-round">
      <div class="ko-round-hdr">${label} <span class="ko-period">${per}</span></div>
      <div class="ko-grid">${ms.map(m => koCard(m, myId, league, isFem)).join('')}</div>
    </div>`;
  };

  const base = numGroups;
  if (numGroups === 4) {
    addRound('Achtelfinale (AF)', ['af'], 5);
    addRound('Viertelfinale (VF)', ['vf'], 7);
    addRound('Halbfinale (HF)', ['hf'], 8);
    addRound('Finale &amp; Platz 3', ['final','platz3'], 9);
  } else if (numGroups === 3) {
    addRound('Playoff der Dritten', ['3rd_rr'], base+1);
    addRound('Viertelfinale (VF)', ['vf'], base+2);
    addRound('Halbfinale (HF)', ['hf'], base+4);
    addRound('Finale &amp; Platz 3', ['final','platz3'], base+5);
  } else {
    addRound('Viertelfinale (VF)', ['vf'], base+1);
    addRound('Halbfinale (HF)', ['hf'], base+3);
    addRound('Finale &amp; Platz 3', ['final','platz3'], base+4);
  }
  document.getElementById('ko-content').innerHTML = html;
}

async function saveConfig() {
  const ng = parseInt(document.getElementById('cfg-groups').value);
  const tg = parseInt(document.getElementById('cfg-teams').value);
  if (ng < 2 || ng > 4 || tg < 3 || tg > 12) {
    showToast('Ungültige Werte! Gruppen: 2–4, Teams: 3–12','error'); return;
  }
  const league = AL();
  league.config = { numGroups: ng, teamsPerGroup: tg };
  league.weeks = buildWeeks(ng);

  // Delete old data, regenerate
  await sb.from('matches').delete().eq('liga', league.gender);
  await sb.from('teams').delete().eq('liga', league.gender);
  genLeague(league);

  // Insert teams
  const teamsToInsert = league.teams.map(t => ({
    liga: league.gender, gruppe: t.gruppe, nummer: t.nummer,
    name: t.name, spieler1: '', spieler2: ''
  }));
  const { data: insertedTeams } = await sb.from('teams').insert(teamsToInsert).select();
  const idMap = {};
  insertedTeams?.forEach((dbT, i) => { idMap[league.teams[i].id] = dbT.id; league.teams[i].id = dbT.id; });
  league.matches.forEach(m => {
    if (m.team_a_id) m.team_a_id = idMap[m.team_a_id] || m.team_a_id;
    if (m.team_b_id) m.team_b_id = idMap[m.team_b_id] || m.team_b_id;
  });

  // Insert matches
  const matchesToInsert = league.matches.map(m => ({
    liga: league.gender, phase: m.phase, gruppe: m.gruppe || null, slot: m.slot || null,
    team_a_id: m.team_a_id || null, team_b_id: m.team_b_id || null,
    score_a: null, score_b: null, label_a: m.label_a || '', label_b: m.label_b || ''
  }));
  const { data: insertedMatches } = await sb.from('matches').insert(matchesToInsert).select();
  insertedMatches?.forEach((dbM, i) => { league.matches[i].id = dbM.id; });

  await sb.from('liga_config').update({ num_groups: ng, teams_per_group: tg, weeks: league.weeks }).eq('liga', league.gender);

  openWeeks[SESSION.adminEditLeague] = new Set();
  tblGroup[SESSION.adminEditLeague] = 'A';
  adminGrp[SESSION.adminEditLeague] = 'A';
  adminMatchGrp[SESSION.adminEditLeague] = 'A';
  initAdminPanel();
  if (SESSION.currentLeague === SESSION.adminEditLeague) { buildTblTabs(); renderSpielplan(); renderTabelle(); renderKO(); }
  showToast('Liga neu generiert!','ok');
}

  const ac = accentClassAdmin();
  const koTabs = numGroups === 4
    ? [{id:'af',l:'Achtelfinale'},{id:'vf',l:'Viertelfinale'},{id:'hf',l:'Halbfinale'},{id:'finale',l:'Finale/P3'}]
    : numGroups === 3
    ? [{id:'3rd_rr',l:'Playoff 3.'},{id:'vf',l:'Viertelfinale'},{id:'hf',l:'Halbfinale'},{id:'finale',l:'Finale/P3'}]
    : [{id:'vf',l:'Viertelfinale'},{id:'hf',l:'Halbfinale'},{id:'finale',l:'Finale/P3'}];
  const allTabs = [...groups.map(g => ({id:g,l:`Gruppe ${g}`})), ...koTabs];
  adminMatchGrp[SESSION.adminEditLeague] = allTabs[0].id;
  document.getElementById('admin-match-tabs').innerHTML = allTabs.map((t, i) =>
    `<button class="group-tab${i === 0 ? ' active-' + ac : ''}" onclick="setAdminMG('${t.id}',this)">${t.l}</button>`
  ).join('');
  renderAdminMatches();
}

function setAdminMG(g, btn) {
  const ac = accentClassAdmin();
  btn.parentElement.querySelectorAll('.group-tab').forEach(b => b.classList.remove('active-m','active-f'));
  btn.classList.add(`active-${ac}`);
  adminMatchGrp[SESSION.adminEditLeague] = g;
  renderAdminMatches();
}

function renderAdminMatches() {
  const league = AL();
  const isFem = SESSION.adminEditLeague === 'female';
  const ac = accentClassAdmin();
  const tab = adminMatchGrp[SESSION.adminEditLeague];
  let ms = [];
  if (['A','B','C','D','E','F','G','H'].includes(tab))
    ms = league.matches.filter(m => m.phase === 'group' && m.gruppe === tab);
  else if (tab === 'af') ms = league.matches.filter(m => m.phase === 'af').sort((a,b)=>a.slot-b.slot);
  else if (tab === 'vf') ms = league.matches.filter(m => m.phase === 'vf').sort((a,b)=>a.slot-b.slot);
  else if (tab === 'hf') ms = league.matches.filter(m => m.phase === 'hf').sort((a,b)=>a.slot-b.slot);
  else if (tab === '3rd_rr') ms = league.matches.filter(m => m.phase === '3rd_rr').sort((a,b)=>a.slot-b.slot);
  else if (tab === 'finale') ms = league.matches.filter(m => m.phase === 'final' || m.phase === 'platz3');

  document.getElementById('admin-matches').innerHTML = ms.map(m => {
    const tA = teamById(m.team_a_id, league), tB = teamById(m.team_b_id, league);
    const nameA = tA?.name || (m.label_a || 'TBD');
    const nameB = tB?.name || (m.label_b || 'TBD');
    const has = m.score_a !== null;
    const slotLbl = koSlotLabel(m);
    return `<div class="match-card">
      ${slotLbl ? `<div class="match-phase-row">${pbadge(m, ac)}<span style="font-size:10px;color:var(--muted);font-weight:600;margin-left:6px;">${slotLbl}</span></div>` : ''}
      <div class="match-body">
        <div class="match-teams-col">
          <div class="match-team-row">
            <div style="flex:1;min-width:0;">
              <div class="team-name-main">${nameA}</div>
              ${tA ? `<div class="team-players-txt">${tA.spieler1} · ${tA.spieler2}</div>` : ''}
            </div>
          </div>
          <div class="match-team-row">
            <div style="flex:1;min-width:0;">
              <div class="team-name-main">${nameB}</div>
              ${tB ? `<div class="team-players-txt">${tB.spieler1} · ${tB.spieler2}</div>` : ''}
            </div>
          </div>
        </div>
        <div class="match-score-col">
          <div class="score-box ${ac} ${!has ? 'tbd' : ''}">${has ? m.score_a : '–'}</div>
          <div class="vs-lbl">VS</div>
          <div class="score-box ${ac} ${!has ? 'tbd' : ''}">${has ? m.score_b : '–'}</div>
        </div>
      </div>
      <div class="match-btn-row">
        <button class="btn-sm btn-${ac}" onclick="openModal(${m.id},'${SESSION.adminEditLeague}')">${has ? '✏ Korrigieren' : '+ Ergebnis'}</button>
      </div>
    </div>`;
  }).join('') || '<div class="empty">Keine Spiele verfügbar</div>';
}

// ══════════════════════════════════════════
// MODAL
// ══════════════════════════════════════════
function openModal(id, leagueKey) {
  modalMatchId = { id, leagueKey };
  const league = LEAGUES[leagueKey];
  const m = league.matches.find(m => m.id === id);
  const tA = teamById(m.team_a_id, league), tB = teamById(m.team_b_id, league);
  const nameA = tA?.name || (m.label_a || 'TBD');
  const nameB = tB?.name || (m.label_b || 'TBD');
  const isFem = leagueKey === 'female';
  const ac = isFem ? 'female' : 'male';
  document.getElementById('modal-title').textContent = 'Ergebnis eintragen';
  document.getElementById('modal-sub').textContent = `${nameA} vs ${nameB}`;
  document.getElementById('score-a').value = m.score_a ?? '';
  document.getElementById('score-b').value = m.score_b ?? '';
  document.getElementById('score-a').className = isFem ? 'female' : '';
  document.getElementById('modal-save-btn').className = `btn-save ${ac}`;
  document.getElementById('score-modal').classList.add('open');
  setTimeout(() => document.getElementById('score-a').focus(), 100);
}

function closeModal() {
  document.getElementById('score-modal').classList.remove('open');
  modalMatchId = null;
}

async function saveScore() {
  const a = parseInt(document.getElementById('score-a').value);
  const b = parseInt(document.getElementById('score-b').value);
  if (isNaN(a) || isNaN(b) || a < 0 || b < 0) { showToast('Bitte gültige Werte eingeben!','error'); return; }
  const { id, leagueKey } = modalMatchId;
  const league = LEAGUES[leagueKey];
  const m = league.matches.find(m => m.id === id);
  m.score_a = a; m.score_b = b;
  tryFillKO(league);

  // Save to Supabase
  await sb.from('matches').update({ score_a: a, score_b: b }).eq('id', id);

  // Save any auto-filled KO matches
  const koPhases = ['af','vf','hf','final','platz3'];
  for (const km of league.matches.filter(m2 => koPhases.includes(m2.phase) && m2.team_a_id && m2.team_b_id)) {
    await sb.from('matches').update({ team_a_id: km.team_a_id, team_b_id: km.team_b_id }).eq('id', km.id);
  }

  closeModal();
  if (SESSION.currentLeague === leagueKey) { renderSpielplan(); renderTabelle(); renderKO(); }
  if (SESSION.isAdmin) renderAdminMatches();
  showToast('Ergebnis gespeichert!', leagueKey === 'female' ? 'female' : 'male');
}

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function teamById(id, league) { return league?.teams.find(t => t.id === id); }
function df(d) { if (!d) return ''; const [y,mo,day] = d.split('-'); return `${day}.${mo}.${y}`; }
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => t.className = 'toast', 3000);
}

document.getElementById('login-password').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
document.getElementById('score-modal').addEventListener('click', e => { if (e.target.id==='score-modal') closeModal(); });
</script>
